[project]
name = "digital-turtles"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bcrypt==4.0.1",
    "fastapi>=0.110",
    "fastembed>=0.3.0",
    "groq>=1.7.0",
    "httpx>=0.27",
    "joblib>=1.3",
    "numpy>=1.24.0",
    "onnxruntime>=1.17",
    "pandas>=3.1.1",
    "passlib[bcrypt]==1.7.4",
    "pydantic-settings>=2.2",
    "pydantic[email]>=2.6",
    "pyjwt>=2.8",
    "redis>=5.0.0",
    "scikit-learn>=1.4",
    "supabase>=2.5",
    "tokenizers>=0.15",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"